[package]
name = "news-validator"
version = "0.1.0"
edition = "2021"
description = "Rust library for validating news article data"
license = "MIT OR Apache-2.0"
authors = ["Your Name <your.email@example.com>"]

# Build as a static library for C interoperability
[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
lazy_static = "1.4"
thiserror = "1.0"

[build-dependencies]
cbindgen = "0.26"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3