language = "C"
include_guard = "NEWS_VALIDATOR_H"
autogen_warning = "/* Generated by cbindgen. Do not edit manually. */"
braces = "SameLine"
line_length = 100
tab_width = 2
documentation = true
documentation_length = 120

[export]
include = [
    "CValidationConfig",
    "validate_news_article",
    "free_c_string"
]

[export.item]
rename = "CValidationConfig"

[export.item."CValidationConfig"]
derive = []

[parse]
parse_deps = true
include = ["news-validator"]

[parse.expand]
crates = ["news-validator"]